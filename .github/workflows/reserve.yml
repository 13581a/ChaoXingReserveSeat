# This is a basic workflow that is manually triggered

name: auto_Reserve

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # 顺手升级到 v4，避免旧版 node 警告导致中断

      - name: Set up Python 3.11
        uses: actions/setup-python@v5 # 顺手升级到 v5
        with:
          python-version: 3.11

      - name: install dependency
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests playwright
          python -m playwright install chromium  # 使用 python -m 调用更稳定
          python -m playwright install-deps      # 补全 ubuntu 所有的底层依赖库

      - name: run script
        env:
          USERNAMES: ${{ secrets.USERNAMES }}
          PASSWORDS: ${{ secrets.PASSWORDS }}
        run: |
          python main.py -m reserve --action
